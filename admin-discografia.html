nav ul {

  gap: 1em;
  background-color: #f6f0e0;
  flex-wrap: wrap;
}

nav ul li a {
  text-decoration: none;
  color: #000;
  font-weight: bold;
}

/* ICONO DE MENU */
.menu-icon {
  display: none;
  font-size: 2em;
  position: absolute;
  top: 1em;
  right: 1em;
  z-index: 100;
  cursor: pointer;
  color: #111111;

}

/* MENU RESPONSIVO */
@media (max-width: 768px) {
  .menu-icon {
    display: block;
  }

  nav {
    position: fixed;
    top: 0;
    left: -100%;
    width: 75%;
    height: 100vh;
    background-color: #f6f0e0;
    z-index: 90;
    overflow-y: auto;
    transition: left 0.3s ease-in-out;
  }

  nav.show {
    left: 0;
  }

  nav ul {
    flex-direction: column;
    align-items: start;
    padding: 2em;
    gap: 1.5em;
  }
}

<script>
  document.addEventListener('click', function (event) {
    const menu = document.querySelector("nav");
    const menuIcon = document.querySelector(".menu-icon");

    // Si el menú está abierto y el clic no fue dentro del menú ni en el icono
    if (menu.classList.contains("show") &&
        !menu.contains(event.target) &&
        !menuIcon.contains(event.target)) {
      menu.classList.remove("show");
    }
  });
</script>

 <script>
async function cargarAlbumesAdmin() {
  const contenedor = document.getElementById('albumes-existentes');
  contenedor.innerHTML = '<p>Cargando álbumes...</p>';

  try {
    const res = await fetch('/api/discografia');
    const albumes = await res.json();

    contenedor.innerHTML = '';
    albumes.forEach(album => {
      const seccion = document.createElement('div');
      seccion.style.border = '1px solid #ccc';
      seccion.style.padding = '1em';
      seccion.style.marginBottom = '1em';
      seccion.innerHTML = `
        <h3>${album.titulo}</h3>
        <img src="${album.portada}" alt="Portada" width="150">
        <img src="${album.contraportada}" alt="Contraportada" width="150">
        <p>${album.descripcion}</p>
        <ul>
          ${album.canciones.map(c => `
            <li>
              ${c.titulo}<br>
              <audio controls src="${c.archivo}" style="margin-top: 4px;"></audio>
            </li>`).join('')}
        </ul>
        <button onclick="eliminarAlbum(${album.id})">Eliminar</button>
        <button onclick='llenarFormularioEditar(${JSON.stringify(album)})'>Editar</button>
      `;
      contenedor.appendChild(seccion);
    });
  } catch (error) {
    contenedor.innerHTML = '<p style="color:red">No se pudieron cargar los álbumes.</p>';
  }
}

async function eliminarAlbum(id) {
  if (!confirm('Confirma que deseas eliminar este álbum')) return;
  const res = await fetch(`/api/discografia/${id}`, { method: 'DELETE' });
  const data = await res.json();
  alert(data.message || 'Eliminado');
  cargarAlbumesAdmin();
}

function llenarFormularioEditar(album) {
  const form = document.getElementById('form-discografia');
  form.setAttribute('data-id', album.id);

  document.getElementById('titulo').value = album.titulo;
  document.getElementById('descripcion').value = album.descripcion;
  document.getElementById('numCanciones').value = album.canciones.length;

  // Mostrar imágenes actuales (solo visualmente)
  const portadaLabel = document.querySelector('label[for="portada"]');
  const contraportadaLabel = document.querySelector('label[for="contraportada"]');

  if (!document.getElementById('vista-portada')) {
    const imgPortada = document.createElement('img');
    imgPortada.src = album.portada;
    imgPortada.id = 'vista-portada';
    imgPortada.style.width = '100px';
    imgPortada.style.display = 'block';
    portadaLabel.after(imgPortada);
  } else {
    document.getElementById('vista-portada').src = album.portada;
  }

  if (!document.getElementById('vista-contraportada')) {
    const imgContraportada = document.createElement('img');
    imgContraportada.src = album.contraportada;
    imgContraportada.id = 'vista-contraportada';
    imgContraportada.style.width = '100px';
    imgContraportada.style.display = 'block';
    contraportadaLabel.after(imgContraportada);
  } else {
    document.getElementById('vista-contraportada').src = album.contraportada;
  }

  cancionesContainer.innerHTML = '';
  album.canciones.forEach((c, index) => {
    const div = document.createElement("div");
    div.className = "cancion-input";
    div.innerHTML = `
      <input type="text" name="cancionTitulo[]" value="${c.titulo}" ${album.id ? '' : 'required'}>
      <input type="file" name="cancionAudio[]" accept="audio/*">
      <audio controls src="${c.archivo}" style="margin-top: 4px; display:block;"></audio>
      <small style="display:block; font-style:italic;">Actual: ${c.archivo.split('/').pop()}</small>
    `;
    cancionesContainer.appendChild(div);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
  alert('Formulario listo para editar. Puedes cambiar lo que desees y guardar. Las canciones e imágenes se conservarán si no las reemplazas.');
}

const form = document.getElementById("form-discografia");
form.addEventListener("submit", function (e) {
  e.preventDefault();
  const formData = new FormData(form);
  const albumId = form.getAttribute('data-id');

  const url = albumId ? `/api/discografia/${albumId}` : '/api/discografia';
  const method = albumId ? 'PUT' : 'POST';

  // ✅ Elimina solo los campos required de archivo si es edición
  if (albumId) {
    const archivos = form.querySelectorAll('input[type="file"]');
    archivos.forEach(input => input.removeAttribute('required'));
  }

  fetch(url, {
    method,
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      alert(data.mensaje || 'Guardado correctamente');
      form.reset();
      cancionesContainer.innerHTML = "";
      form.removeAttribute('data-id');
      const imgPortada = document.getElementById('vista-portada');
      const imgContraportada = document.getElementById('vista-contraportada');
      if (imgPortada) imgPortada.remove();
      if (imgContraportada) imgContraportada.remove();
      cargarAlbumesAdmin();
    })
    .catch(err => {
      console.error(err);
      alert('Error al guardar el álbum');
    });
});

cargarAlbumesAdmin();
</script>
